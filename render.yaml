services:
  - type: web
    name: star-tracking-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/db/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DISABLE_FIRESTORE
        value: "true"
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: ADMIN_EMAIL
        value: hassanmehdi1444@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
